<!DOCTYPE html>
<html lang="sv">
<head>
<meta charset="UTF-8">
<title>Quiz – Motoriserad penningtvätt</title>
<style>
body {
    font-family: Arial, sans-serif;
    background: #111;
    color: #eee;
    padding: 20px;
}

h1 {
    text-align: center;
}

.question {
    background: #1e1e1e;
    padding: 15px;
    margin: 15px 0;
    border-radius: 10px;
}

button {
    padding: 10px;
    margin-top: 10px;
    cursor: pointer;
}

.correct {
    background-color: #1f7a1f;
}

.wrong {
    background-color: #7a1f1f;
}
</style>
</head>
<body>

<h1>Motoriserad penningtvätt – Quiz</h1>

<div id="quiz"></div>

<script>

const questions = [
{
q: "Vad gör fordonssektorn attraktiv för penningtvätt?",
a: ["Låg omsättning", "Internationell rörlighet och högt värde", "Låg efterfrågan", "Statlig kontroll"],
correct: 1
},
{
q: "Vad innebär penningtvätt?",
a: ["Att tjäna pengar", "Att flytta pengar mellan banker", "Att dölja brottsvinster", "Att investera lagligt"],
correct: 2
},
{
q: "Hur stor andel av fordonsföretag uppskattas ha koppling till brott?",
a: ["1 av 50", "1 av 15", "1 av 5", "1 av 100"],
correct: 1
},
{
q: "Vad är 'omvänd penningtvätt'?",
a: ["Tvätta pengar baklänges", "Göra kontanter digitala", "Omvandla spårbara pengar till kontanter utomlands", "Betala skatt"],
correct: 2
},
{
q: "Vad är ett vanligt syfte med bilmålvakter?",
a: ["Spara pengar", "Dölja ägande av fordon", "Sälja bilar", "Hyra ut bilar"],
correct: 1
},
{
q: "Vad innebär KYC?",
a: ["Kreditkontroll", "Know Your Customer", "Kundfakturering", "Kontanthantering"],
correct: 1
},
{
q: "Vad är ett tecken på penningtvätt vid bilköp?",
a: ["Normal finansiering", "Små betalningar", "Stora kontantbetalningar utan förklaring", "Leasing"],
correct: 2
},
{
q: "Vad används falska anställningsintyg till?",
a: ["Få jobb", "Få lån", "Betala skatt", "Registrera bil"],
correct: 1
},
{
q: "Vad är MTIC-bedrägeri?",
a: ["Bilförsäljning", "Momskarusell", "Hyresbedrägeri", "Exporthandel"],
correct: 1
},
{
q: "Vilken roll har 'missing trader'?",
a: ["Betalar moms", "Tar emot moms men betalar inte in den", "Exporterar varor", "Driver leasing"],
correct: 1
},
{
q: "Vad är syftet med buffertföretag?",
a: ["Öka vinsten", "Dölja spår", "Sänka skatt", "Importera varor"],
correct: 1
},
{
q: "Vad är vanligt inom bilverkstäder kopplat till brott?",
a: ["Höga löner", "Svarta löner", "Statliga bidrag", "Export"],
correct: 1
},
{
q: "Vad är 'kickback' i detta sammanhang?",
a: ["Bonus", "Vit lön som lämnas tillbaka kontant", "Rabatt", "Lån"],
correct: 1
},
{
q: "Vad är ett syfte med leasingbedrägerier?",
a: ["Hyra bil", "Tvätta pengar via betalningar", "Köpa bil billigare", "Sälja vidare"],
correct: 1
},
{
q: "Vad är smurfing?",
a: ["Biltyp", "Många små insättningar för att undvika larm", "Exportmetod", "Kreditmodell"],
correct: 1
},
{
q: "Vad gör hyrbilar attraktiva för brott?",
a: ["Billiga", "Anonymitet", "Snabba", "Stora"],
correct: 1
},
{
q: "Vilken myndighet tar emot misstankerapporter?",
a: ["Skatteverket", "Polisen/Finanspolisen", "Transportstyrelsen", "Tullverket"],
correct: 1
},
{
q: "Vad kan hända vid bristande AML-efterlevnad?",
a: ["Inget", "Böter eller stängning", "Rabatt", "Skatteavdrag"],
correct: 1
},
{
q: "Vad används falska fakturor till?",
a: ["Bokföring", "Dölja pengaflöden", "Skatt", "Köp"],
correct: 1
},
{
q: "Vad är ett syfte med bilmålvakter i brott?",
a: ["Hyra ut bilar", "Undvika ansvar och spårning", "Sälja bilar", "Importera bilar"],
correct: 1
}
];

function shuffle(array) {
    return array.sort(() => Math.random() - 0.5);
}

const selected = shuffle(questions).slice(0,5);

const quizDiv = document.getElementById("quiz");

selected.forEach((q, index) => {
    const div = document.createElement("div");
    div.className = "question";

    let html = `<p>${q.q}</p>`;

    q.a.forEach((option, i) => {
        html += `<button onclick="checkAnswer(this, ${i}, ${q.correct})">${option}</button><br>`;
    });

    div.innerHTML = html;
    quizDiv.appendChild(div);
});

function checkAnswer(button, selected, correct) {
    const parent = button.parentElement;
    const buttons = parent.querySelectorAll("button");

    buttons.forEach(btn => btn.disabled = true);

    if(selected === correct) {
        button.classList.add("correct");
    } else {
        button.classList.add("wrong");
        buttons[correct].classList.add("correct");
    }
}

</script>

</body>
</html>
